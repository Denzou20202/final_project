apiVersion: 1

# Visual-only: this rule has no contact point / notification policy wired
# up (see docker-compose.prod.yml — no Alertmanager, no SMTP configured for
# Grafana itself), by deliberate choice — the goal is a state you can SEE in
# Grafana's Alerting page and on the dashboard panel it backs (see
# veloxdesk-overview.json panel id 8), not a push notification. Added after
# a real brute-force incident on 2026-08-26 (510 failed logins + 276
# rate-limited requests against /api/auth/login over ~66 minutes) was only
# discovered after the fact, from an unrelated tool's report — this makes
# the next one visible from our own monitoring instead.
groups:
  - orgId: 1
    name: auth-security
    folder: VeloxDesk Alerts
    interval: 1m
    rules:
      - uid: auth-login-bruteforce-spike
        title: Login brute-force spike (401+429 on /api/auth/login)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(http_requests_total{route=~".*login.*", status_code=~"401|429"}[5m]))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Sustained rate of failed/rate-limited login attempts on /api/auth/login — matches the pattern of the 2026-08-26 brute-force incident (~30+/min sustained).'

  # Separate group from auth-security above: interval is per-group, and this
  # needs a much coarser one (cert expiry changes slowly, unlike login
  # traffic) — 1m would be wasteful here.
  - orgId: 1
    name: tls-cert-expiry
    folder: VeloxDesk Alerts
    interval: 10m
    rules:
      - uid: tls-cert-expiry-warning
        title: TLS certificate expiring soon (veloxdesk.pp.ua)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: (probe_ssl_earliest_cert_expiry{instance="web:443"} - time()) / 86400
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] }
              refId: C
        # Unlike auth-security's noDataState: OK above — absence of probe
        # data here means the monitoring pipeline itself is broken
        # (blackbox-exporter down, or Prometheus can't reach it), not that
        # everything is fine. Silently treating that as OK would hide
        # exactly the kind of failure this alert exists to catch.
        noDataState: Alerting
        execErrState: Error
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'TLS certificate for veloxdesk.pp.ua has fewer than 14 days remaining — check certbot-renew.sh / the launchd job (~/.local/bin/veloxdesk-certbot-renew.sh) for a silently broken renewal.'
