worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Production: every backend service runs as its own container on the
  # compose network, addressed by service name — unlike the dev nginx.conf,
  # which talks to `nx serve` processes on the host via host.docker.internal.
  #
  # Backend hostnames are deliberately NOT wired up via static `upstream {}`
  # blocks here. An `upstream` block's DNS lookup happens once, at worker
  # startup/reload, and the resolved IP is then cached for that worker's
  # entire lifetime — so redeploying a single backend container (which gets
  # a new IP on the compose network) leaves nginx holding a stale IP and
  # 502ing every request to that service until nginx itself is restarted.
  # This caused a real site-wide outage on 2026-08-13 ("Не удалось загрузить
  # обращения") from a solo ticket-service/chat-service redeploy.
  #
  # Instead, each `location` below resolves its backend per request: it
  # assigns `http://service-name:port` to a variable via `set`, then
  # `proxy_pass`es that variable. A variable in `proxy_pass` is what forces
  # nginx to consult the `resolver` below on every request instead of
  # resolving once at config-load time. Docker's embedded DNS server
  # (127.0.0.11) is used as the resolver so container restarts/redeploys are
  # picked up within the `valid=10s` TTL — no nginx restart required.
  resolver 127.0.0.11 valid=10s;

  # 10r/s + burst=20 turned out to be the same class of mistake as the old
  # api_auth zone below, just for a busier page: opening one ticket detail
  # fires close to 15 parallel GETs on its own (ticket, activity, watch,
  # custom-fields, attachments list + one blob fetch per image, tags,
  # sla-policies, macros), the sidebar adds one more per team and per tag,
  # and any single mutation invalidates and re-fires a good chunk of those
  # at once. A confirmed real burst (one tab, one reload that raced a token
  # refresh) hit 30+ near-simultaneous requests and tripped this — every
  # 429'd request just silently failed client-side (attachment thumbnails
  # in particular got stuck on their loading placeholder forever, no retry).
  # Same IP-keyed caveat as api_auth: this punishes everyone behind that IP
  # at once, not just a single account.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  # 1r/s + burst=5 (below) was tight enough that two people testing behind
  # one forwarded router IP — or a single browser tab's automatic token
  # refresh alongside a manual login click — could trip it during totally
  # normal use. This zone is keyed by IP, not by account, so it punishes
  # everyone sharing that IP at once, not just an actual attacker.
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Ticket attachments cap at 35MB server-side (see attachments.controller.ts);
  # leave headroom for multipart overhead so nginx doesn't 413 valid uploads.
  client_max_body_size 37m;

  server {
    listen 80;
    server_name _;

    # Let's Encrypt's HTTP-01 validator hits this over plain :80 — must not
    # be redirected to https, or the challenge file it's expecting never
    # gets served. certbot writes into this same path via the shared
    # certbot_www volume (see docker-compose.prod.yml + infra/certbot-renew.sh).
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    # Let's Encrypt cert for veloxdesk.pp.ua, mounted from the certbot_certs
    # volume (see docker-compose.prod.yml) — not baked into the image, so
    # renewals (infra/certbot-renew.sh) take effect without a rebuild.
    ssl_certificate     /etc/letsencrypt/live/veloxdesk.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veloxdesk.pp.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # nginx:alpine's own default already symlinks /var/log/nginx/access.log
    # to /dev/stdout, which is why `docker logs` shows requests at all — but
    # that copy dies with the container on every restart/redeploy, which
    # happens routinely. This second, independent access_log (nginx allows
    # more than one) survives across restarts via the nginx_logs volume (see
    # docker-compose.prod.yml) — the only reason a real brute-force incident
    # on 2026-08-26 could only be confirmed after the fact through Prometheus
    # counters, not by actually looking at who/what hit the endpoint.
    access_log /var/log/nginx-persist/access.log combined;
    error_log  /var/log/nginx-persist/error.log warn;

    # Baseline hardening headers — apply to every response in this server
    # block (API JSON and the two static frontends alike), since none of the
    # location blocks below define their own add_header (which would
    # otherwise stop these from being inherited).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy, enforced since 2026-08-27 (shipped as
    # Report-Only first, verified against live login/register with
    # Turnstile, the public FAQ list + an article, and the staff login page
    # — zero console violations, fonts/Turnstile/challenge requests all
    # loaded clean — then switched to enforcing). knowledge-theme
    # customCss/customJs is unconfigured in prod today (both null) so that
    # specific path is unexercised by this verification; re-check it
    # live the first time someone actually sets a custom theme — the
    # 'unsafe-inline' grants below don't depend on that content existing,
    # so there's no reason to expect different behavior once it does.
    #
    # script-src/style-src need 'unsafe-inline': the knowledge-theme
    # customJs/customCss feature (useKnowledgeTheme.ts, client-portal,
    # admin-configured via KnowledgeThemeSettingsPage.tsx, applied on the
    # public /faq) injects admin-authored inline <script>/<style> content at
    # runtime with no build-time nonce/hash possible (it's arbitrary text an
    # admin can change anytime, not a fixed bundle asset) — customJs runs
    # inside a sandboxed <iframe srcdoc>, which per spec inherits the PARENT
    # page's CSP, so the parent's script-src still gates it. React's
    # style={{...}} prop (~35 call sites across both apps, no CSS-in-JS
    # library involved) is separately governed by style-src the same way.
    # Net effect: this CSP does NOT meaningfully block a classic
    # injected-<script> XSS elsewhere on the site — its real value here is
    # frame-ancestors 'none' (clickjacking), base-uri 'self', and
    # constraining connect-src/frame-src/img-src to a known allowlist (caps
    # where a successful XSS could exfiltrate to / load from). Accepted
    # trade-off, not an oversight.
    #
    # img-src needs https: (broad), not just 'self' blob:: sanitizeArticleBody/
    # sanitizeCommentBody (libs/common/src/comment-body/) allow <img> with
    # any http(s) src — an operator/client can legitimately paste an
    # external image URL into a KB article or chat message today, and a
    # stricter img-src would silently break it (broken-image icon).
    #
    # connect-src/frame-src/script-src all need https://challenges.cloudflare.com
    # for the Turnstile widget (script + its own iframe + background
    # telemetry). connect-src 'self' alone covers same-origin /api/... and
    # the wss:// upgrade to /socket.io/ — both are same-origin in production
    # (VITE_*_SERVICE_URL/VITE_CHAT_SERVICE_URL are empty/relative in both
    # frontends' .env.production), no extra origin needed for either.
    #
    # style-src/font-src need the Google Fonts pair (fonts.googleapis.com
    # serves the stylesheet, fonts.gstatic.com serves the actual .woff2
    # files — both index.html files load these identically).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; frame-ancestors 'none';" always;

    # nginx's own default 429 response is a bare HTML page. The frontends
    # read error.response.data.message from a JSON body — against an HTML
    # string that lookup just silently resolves to undefined, so a
    # rate-limited request used to show NO error at all instead of an
    # explanation. error_page with '=' preserves the original 429 status
    # while routing the body through this named location instead.
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"statusCode":429,"message":"Слишком много запросов. Подождите немного и попробуйте снова.","error":"TOO_MANY_REQUESTS"}';
    }

    # --- API routing: one location per resource prefix, matched to the
    # service that owns it. See each service's *.controller.ts for the
    # authoritative route list. ---

    location /api/auth/ {
      limit_req zone=api_auth burst=15 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/teams {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/companies {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cities {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/permission-groups {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ldap-config {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/oidc-config {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/employee-statuses {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tickets {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/telegram {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/sla-policies {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin-manageable ticket-type catalog (ticket-types.controller.ts's own
    # top-level prefix — replaces the old fixed-4-row ticket-type-weights
    # block above). Without this block requests here would silently fall
    # through to the SPA and return index.html instead of JSON.
    location /api/ticket-types {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/attachments {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/macros {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/custom-fields {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/automation-rules {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tags {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ticket-categories {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin-manageable ticket-status catalog (ticket-statuses.controller.ts's
    # own top-level prefix — distinct from /api/tickets/:id/status, which is
    # already covered by the /api/tickets block above since it nests under
    # that prefix). Without this block requests here would silently fall
    # through to the SPA and return index.html instead of JSON.
    location /api/ticket-statuses {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generic RU->UK/EN translate utility (translate.controller.ts) backing
    # the admin-catalog auto-translate form-fill — hosted in ticket-service
    # even though callers include the teams/employee-statuses (user-service)
    # and articles (knowledge-service) admin forms too, since this call has
    # no dependency on the entity being edited. Without this block requests
    # here would silently fall through to the SPA and return index.html
    # instead of JSON (the recurring nginx-routing gotcha — see every other
    # block in this file for prior instances).
    location /api/translate {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CSAT-question catalog (csat.controller.ts's own top-level prefix —
    # distinct from /api/tickets/:id/csat, which is already covered by the
    # /api/tickets block above since it nests under that prefix).
    location /api/csat {
      limit_req zone=api_general burst=60 nodelay;
      set $ticket_service http://ticket-service:3011;
      proxy_pass $ticket_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/articles {
      limit_req zone=api_general burst=60 nodelay;
      set $knowledge_service http://knowledge-service:3006;
      proxy_pass $knowledge_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/public/ {
      limit_req zone=api_general burst=60 nodelay;
      set $knowledge_service http://knowledge-service:3006;
      proxy_pass $knowledge_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/knowledge-theme {
      limit_req zone=api_general burst=60 nodelay;
      set $knowledge_service http://knowledge-service:3006;
      proxy_pass $knowledge_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/search {
      limit_req zone=api_general burst=60 nodelay;
      set $knowledge_service http://knowledge-service:3006;
      proxy_pass $knowledge_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/reports {
      limit_req zone=api_general burst=60 nodelay;
      set $analytics_service http://analytics-service:3005;
      proxy_pass $analytics_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      set $chat_service http://chat-service:3004;
      proxy_pass $chat_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Real health signal, not a stub — proxies to user-service's own
    # GET /api/health (SELECT 1 against Postgres, 503 on failure). Every
    # backend service shares this one Postgres, so a DB outage shows up
    # here regardless of which service happens to be the target; the
    # choice of user-service over the other 5 is close to arbitrary (see
    # 2026-08-27 audit notes) — deliberately NOT an aggregate across all 6
    # (that's what Prometheus/Grafana already do internally for the ops
    # audience; this is for an external uptime checker or a human wanting
    # one URL). Must come before the /api/ catch-all below — nginx's
    # longest-prefix matching means position in the file doesn't actually
    # matter here, but this reads better next to its sibling blocks.
    location /api/health {
      limit_req zone=api_general burst=60 nodelay;
      set $user_service http://user-service:3002;
      proxy_pass $user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all for any /api/ path not matched by one of the specific blocks
    # above — nginx does longest-prefix matching for plain `location`
    # blocks, so this only ever fires for what nothing more specific
    # claimed, regardless of its position in the file. Without this, an
    # unmatched /api/ path falls through to the client-portal catch-all
    # below and silently returns a 200 with index.html instead of a 404 —
    # the recurring "new prefix, forgot the nginx block" trap that has bitten
    # this project multiple times (see the ticket-types/ticket-statuses/
    # translate/csat blocks above, each with its own comment about it).
    # This doesn't remove the need to add a real block for a genuinely new
    # prefix (rate limiting and the correct upstream still won't happen
    # here), it just turns a silent false-positive 200 into an honest 404
    # while that's still missing.
    location /api/ {
      default_type application/json;
      return 404 '{"statusCode":404,"message":"Not Found","error":"NOT_FOUND"}';
    }

    # --- Static frontends, path-based since there's no domain for
    # subdomains: client-portal (public-facing) at root, operator-app
    # (internal staff tool) tucked under /staff/. ---

    # Bare /staff (no trailing slash) doesn't match the alias-based prefix
    # location below as-is and used to fall through to the client-portal
    # catch-all instead, silently serving the wrong app for a bookmarked or
    # hand-typed URL.
    location = /staff {
      return 301 /staff/;
    }

    location /staff/ {
      alias /usr/share/nginx/operator-app/;
      try_files $uri $uri/ /staff/index.html;
    }

    location / {
      root /usr/share/nginx/client-portal;
      try_files $uri $uri/ /index.html;
    }
  }
}
